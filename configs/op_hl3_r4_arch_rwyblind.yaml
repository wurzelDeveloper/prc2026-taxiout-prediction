# Long-horizon rung 4 at 3 h + the ADS-B archive, runway-blind (every own_runway column of
# prc/features/_long_tiers.py dropped, the archive's stand x runway and runway statistics among them). It was the
# deliverable of this lead until the forward check of 10 Oct (findings 10.31): forward (fit Jan-Oct, validate
# Nov+Dec) the archive cost 3.1 s of MAE at 24 h, so the refit moved to op_hl3_r4_rwyblind. Holdout only. Needs the
# archive input: python -m prc.adsb.archive (from a worktree add
# --obs <main>/cache/lab/ideas/stand_archive_obs --src <main>/cache/adsb, or copy the built file and manifest).
extends: op_hl3_r4_arch.yaml
name: op_hl3_r4_arch_rwyblind
notes: "long horizon 3 h r4 + ADS-B archive, runway-blind"
features:
  drop_columns:
