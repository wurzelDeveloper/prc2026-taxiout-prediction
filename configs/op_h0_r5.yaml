# H0 rung 5 (LAB, 2025 only): r5 re-anchored at the recorded off-block (at pushback), plus the realised off-block
# delay against plan and schedule (whole minutes). Holdout only (--no-test). H0 r5 - H1 r5 = the value of waiting
# until the push. Report it on the OP population (taxi < 3,600 s, NM-matched): for stale records the anchor is the
# schedule. Permutation on.
extends: op_base.yaml
name: op_h0_r5
notes: "operational H0 r5 (lab): everything at pushback"
features:
  include: [core_keys, stand_runway_keys, aircraft_identity, op_h0_static, op_h0_plan,
            taxi_distance, taxi_route, stand_geometry,
            op_h0_wx,
            op_h0_traffic,
            op_h0_nm,
            op_h0_feed_lab]
evaluation:
  permutation:
    enabled: true
    repeats: 3
