# H1 rung 3: + other flights' movement records up to the anchor (takeoffs, landings, arrivals taxiing, runway
# mix and configuration age, arrivals' taxi-in anomaly, the stand's last in-block), the flight itself excluded.
extends: op_base.yaml
name: op_h1_r3
notes: "operational H1 r3: + other flights' movement records"
features:
  include: [core_keys, stand_runway_keys, aircraft_identity, op_h1_static, op_h1_plan,
            taxi_distance, taxi_route, stand_geometry,
            op_h1_wx,
            op_h1_traffic]
