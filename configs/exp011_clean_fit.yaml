# exp002 fitted without the impossible training rows: taxi-out under 30 s (helicopter
# pads H/HEL exempt -- their few-second taxis are real), over 2 h, or within an hour
# of a whole day (a block time on the wrong date).
#
# Validation keeps every row, so `rmse` stays comparable with exp002 and with the
# leaderboard, which scores uncleaned 2026 data. `rmse_clean` is the same predictions
# scored on the rows these rules leave. exp002 already clips the fit target to
# [60, 7200]; this drops such rows instead of pinning them at the bound.
#
#   python -m prc audit -c exp011_clean_fit.yaml        # what the rules flag, per airport
#   python -m prc train -c exp011_clean_fit.yaml --seeds 3
extends: exp002_catboost_core.yaml
name: catboost_clean_fit
notes: "exp002 minus impossible rows (min 30 s, max 7200 s, day offsets); Rome untyped kept"

data:
  clean:
    min_taxi_sec: 30
    max_taxi_sec: 7200
    day_offset_tol_sec: 3600
    drop_from_fit: true
