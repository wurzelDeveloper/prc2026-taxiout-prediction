# Rule T's own-slot bound (findings 10.36, amended before any run): op_h1_f4_adsb without ANY realised departure-side
# column after the anchor, at airport or runway level, because the own takeoff, push, de-icing and hold leave traces in
# all of them (one runway slot; where one runway is in use the airport and the own runway are the same). What stays:
# the other flights' plans (O*), the realised ARRIVALS (landings, arrivals taxiing, their taxi-in anomaly, the ADS-B
# taxi-ins; tier F), whose remaining own trace is the next arrival at the own stand. No NM block (every one of its
# columns is departure-side).
extends: op_h1_f4_adsb.yaml
