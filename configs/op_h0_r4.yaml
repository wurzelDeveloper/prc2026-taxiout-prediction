# H0 rung 4 (LAB, 2025 only): op_h0_r5 without the airport's own off-block feed (op_h0_feed_lab), i.e. everything at the
# push but the A-CDM AOBT records of other flights. Holdout only (--no-test). H0 r5 - H0 r4 = the feed's value at the push.
extends: op_base.yaml
name: op_h0_r4
notes: "operational H0 r4 (lab): at pushback, without the off-block feed"
features:
  include: [core_keys, stand_runway_keys, aircraft_identity, op_h0_static, op_h0_plan,
            taxi_distance, taxi_route, stand_geometry,
            op_h0_wx,
            op_h0_traffic,
            op_h0_nm]
