[project]
name = "prc-challenge-2026"
version = "0.1.0"
description = "Taxi-out time prediction pipeline for the PRC Data Challenge 2026"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Lukas Tyburzy" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "scipy",            # taxiway routing (prc/geometry/routing.py); already a scikit-learn dependency
    "catboost>=1.2",
    "tqdm>=4.66",
    "joblib>=1.3",
    "requests",         # prc fetch-adsb (prc/adsb/stream.py)
    "orjson",           # prc fetch-adsb: parses the adsb.lol trace files
]

[project.optional-dependencies]
notebooks = ["ipykernel", "matplotlib", "nbformat", "nbclient"]
dev = ["pytest>=8"]
# other learner families, not in the submitted lineage: model.type lightgbm (no run uses it);
# lab/adsb_apply.py --xgb (findings 10.20)
extra-learners = ["lightgbm", "xgboost"]

[build-system]
requires = ["setuptools>=77"]   # PEP 639 licence expression and license-files
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prc*"]

# The package lives at the repo root, so `python -m prc ...` works without an
# install. `pip install -e .` is optional convenience only.

[tool.pytest.ini_options]
testpaths = ["tests"]
